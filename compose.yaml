services:
  api:
    build: .
    container_name: factoryflow_api
    command : npm run dev
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-5000}
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - .:/projects
      - /projects/node_modules
    depends_on:
      - mongo
  mongo:
    image: mongo:7
    container_name: factoryflow_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
volumes:
  mongo_data:
  