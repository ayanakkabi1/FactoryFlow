services:
  api:
    build: .
    container_name: factoryflow_api
    command: npm run dev
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - .env
    environment:
      PORT: ${PORT:-5000}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/factoryflow?replicaSet=rs0}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - .:/projects
      - /projects/node_modules
    depends_on:
      mongo-init:
        condition: service_completed_successfully

  mongo:
    image: mongo:7
    container_name: factoryflow_db
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' localhost:27017 | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: ["mongosh", "--host", "mongo:27017", "--eval"]
    command:
      - "try { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongo:27017'}]}) } catch (e) { if (e.codeName !== 'AlreadyInitialized') throw e }"

volumes:
  mongo_data:
